global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]

  - job_name: nvidia-gpu
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
