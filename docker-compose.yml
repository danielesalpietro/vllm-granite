services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-granite:local
    container_name: vllm-granite
    restart: unless-stopped

    # ── GPU ──────────────────────────────────────────────────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1          # aumenta per multi-GPU con tensor_parallel
              capabilities: [gpu]

    # ── Variabili d'ambiente ─────────────────────────────────────────────────
    env_file: .env

    # ── Porte ────────────────────────────────────────────────────────────────
    ports:
      - "${PORT:-8000}:${PORT:-8000}"

    # ── Volumi ───────────────────────────────────────────────────────────────
    volumes:
      # Cache HuggingFace persistente → i pesi non vengono ri-scaricati
      - hf_cache:/root/.cache/huggingface

    # ── IPC host ─────────────────────────────────────────────────────────────
    # Richiesto da vLLM v0.25+ per UVA (Unified Virtual Addressing):
    # GPUModelRunnerV2 alloca buffer pinned accessibili da CPU e GPU.
    # Docker --ipc=private blocca questa funzionalità → UVA not available.
    ipc: host

    # ── Memoria condivisa ────────────────────────────────────────────────────
    # Con ipc:host shm_size è ignorato (usa la shm dell'host), ma lo
    # lasciamo come documentazione per chi usa --ipc=shareable.
    shm_size: "16gb"

    # ── Limite RAM per Docker ─────────────────────────────────────────────────
    # CPU offloading usa la RAM dell'host. Con 192 GB disponibili,
    # lasciamo ampio margine (150 GB). Regola in base al modello scelto.
    mem_limit: "150g"
    memswap_limit: "150g"    # disabilita swap (stesso valore = no swap)

    # ── Limiti ulimit per prestazioni ottimali ───────────────────────────────
    ulimits:
      memlock: -1              # nessun limite su memoria bloccata (hugepages)
      stack: 67108864

    # ── Healthcheck ──────────────────────────────────────────────────────────
    # start_period alto perché i modelli grandi impiegano minuti a caricare
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${PORT:-8000}/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s

  # ── AnythingLLM ────────────────────────────────────────────────────────────
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: vllm-granite-anythingllm
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy   # aspetta che vLLM sia pronto

    ports:
      - "3001:3001"

    volumes:
      - anythingllm_storage:/app/server/storage

    environment:
      # ── Storage (OBBLIGATORIO) ──────────────────────────────────────────────
      STORAGE_DIR: "/app/server/storage"

      # ── Connessione a vLLM ──────────────────────────────────────────────────
      # "vllm" è il nome del servizio Docker → risolto automaticamente
      LLM_PROVIDER: "generic-openai"
      GENERIC_OPEN_AI_BASE_PATH: "http://vllm:${PORT:-8000}/v1"
      GENERIC_OPEN_AI_MODEL_PREF: "granite"
      GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT: "16384"
      GENERIC_OPEN_AI_API_KEY: "not-required"

      # ── Embedding (locale, no GPU richiesto) ────────────────────────────────
      EMBEDDING_ENGINE: "native"

      # ── Vector DB (LanceDB embedded, nessun servizio esterno) ───────────────
      VECTOR_DB: "lancedb"

      # ── Credenziali UI (impostare AUTH_TOKEN in .env, cambia in produzione) ──
      AUTH_TOKEN: "${AUTH_TOKEN:-changeme}"

      # ── JWT (obbligatorio per creare sessioni/login, impostare in .env) ─────
      JWT_SECRET: "${JWT_SECRET:-changeme-generate-a-real-secret-with-openssl-rand--hex-32}"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Monitoring (read-only) ───────────────────────────────────────────────────
  # Dashboard per osservare vLLM: throughput, cache KV, latenze, GPU, RAM.
  # Nessuno di questi container può modificare vLLM/AnythingLLM.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"

  # Metriche hardware GPU reali (utilizzo %, VRAM, temperatura) via nvidia-smi
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:latest
    container_name: nvidia-gpu-exporter
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # RAM/CPU per container Docker — segnale diretto per il CPU offload
  # (quanta RAM host sta usando vllm-granite)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # ── Accesso anonimo in sola lettura, nessuna password da gestire ────────
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DEFAULT_APP_MODE: "development"

volumes:
  hf_cache:
    driver: local
  anythingllm_storage:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
